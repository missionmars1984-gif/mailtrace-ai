services:
  - type: web
    name: mailtrace-ai
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0

  - type: web
    name: mailtrace-exchange
    env: node
    plan: free
    buildCommand: npm run build:exchange
    startCommand: npm run start:exchange
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
